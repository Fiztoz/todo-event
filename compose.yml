services:
  mongo:
    image: mongo:8
    container_name: todoe-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DATABASE: todoe
    volumes:
      - mongo-data:/data/db

  nats:
    image: nats:latest
    container_name: todoe-nats
    restart: unless-stopped
    ports:
      - "4222:4222"

  onboarding:
    image: golang:1.25-alpine
    container_name: todoe-onboarding
    working_dir: /app
    volumes:
      - .:/app
      - go-cache:/root/go/pkg/mod
    command: go run ./cmd/onboarding
    ports:
      - "3002:3002"
    environment:
      MONGO_URI: mongodb://root:root@mongo:27017
      NATS_URL: nats://nats:4222
      DB_NAME: todoe_onboarding
      PORT: "3002"
    depends_on:
      - mongo
      - nats

  loki:
    image: grafana/loki:latest
    container_name: todoe-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  grafana:
    image: grafana/grafana:latest
    container_name: todoe-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning
    depends_on:
      - loki

volumes:
  mongo-data:
  grafana-data:
  go-cache:
